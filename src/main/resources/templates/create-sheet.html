<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create New Sheet</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Create New Sheet</h1>

<form action="#" th:action="@{/admin/create-sheet}" th:object="${sheet}" method="post">
  <label>Sheet Name:</label>
  <input type="text" th:field="*{sheetName}" required /><br><br>

  <label>Summary:</label>
  <input type="text" th:field="*{summary}" required /><br><br>

  <label>Google Sheet ID:</label>
  <input type="text" th:field="*{sheetId}" required /><br><br>

  <label>Google Sheet URL:</label>
  <input type="url" th:field="*{sheetUrl}" required /><br><br>

  <label>Deadline:</label>
  <input type="date" th:field="*{deadline}" required /><br><br>

  <button type="submit">Create</button>
</form>
</body>
</html>
