<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Calibri', sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: white;
    }

    .logo-left {
      width: 120px;
    }

    .logo-right {
      width: 90px;
    }


.title-box {
  text-align: center;
  padding: 0 1rem;
}

.title-box h1 {
  font-size: 3.5rem;
  font-weight: 1500;
  color: #2F2F8F;
  margin-bottom: 0.1rem;
  margin-top: 0rem;
}

.title-box h3 {
  font-size: 2rem;
  font-weight: 1000;
  color: #2F2F8F;
  margin-bottom: 0.1rem;
  margin-top: 0rem;
}

.title-box h2 {
  font-size: 2rem;
  font-weight: 900;
  color: #000;
  margin-top: 0.5rem;
}

    .blue-line {
      height: 6px;
      background-color: #2F2F8F;
      width: 100%;
    }

    /* Dashboard Content */
    .dashboard-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .dashboard-box {
      background-color: #2F2F8F;
      width: 90%;
      max-width: 900px;
      padding: 2rem;
      border-radius: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .dashboard-box h2 {
      color: white;
      font-size: 3rem;
      margin-bottom: 2rem;
    }

    .button {
      display: inline-block;
      padding: 1rem 2.5rem;
      margin: 1.2rem;
      font-size: 1.4rem;
      font-weight: 700;
      background-color: #D9592A;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
    }

    .button:hover {
      background-color: #b7451a;
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
    }

    .footer {
      background-color: #2F2F8F;
      color: white;
      text-align: center;
      padding: 0.8rem 0;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .dashboard-box h2 {
        font-size: 2rem;
      }

      .button {
        font-size: 1.1rem;
        padding: 0.8rem 2rem;
      }

      .logo-left, .logo-right {
        width: 60px;
      }

      .title-box h1 {
        font-size: 1.8rem;
      }

      .title-box h3 {
        font-size: 1rem;
      }

      .title-box h2 {
        font-size: 0.9rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Header Section -->
<div class="header">
  <img th:src="@{/images/indianrailwayslogo.jpg}" alt="Left Logo" class="logo-left" />
  <div class="title-box">
    <h1>NORTHERN RAILWAYS</h1>
    <h3>Moradabad Division</h3>
    <h2>Portal for Test Room Control</h2>
  </div>
  <img th:src="@{/images/indianemblem.png}" alt="Right Logo" class="logo-right" />
</div>

<!-- Blue Line -->
<div class="blue-line"></div>

<!-- Main Dashboard Box -->
<div class="dashboard-container">
  <div class="dashboard-box">
    <h2>Hello Admin</h2>
    <a th:href="@{/admin/user-dashboard}" class="button">👥 User Dashboard</a>
    <br>
    <a th:href="@{/admin/sheet-dashboard}" class="button">📄 Sheet Dashboard</a>
    <br>
    <a th:href="@{/logout}" class="button">🚪 Logout</a>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  All Rights Reserved
</div>

</body>
</html>
